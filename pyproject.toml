[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-hardware"
version = "0.1.0"
description = "State-driven computer architecture primitives for Manim Community"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["manim", "computer architecture", "hardware", "animation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Manim",
  "Programming Language :: Python :: 3",
]
dependencies = ["manim>=0.19.2,<0.23", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/walruto/manim-hardware"
Issues = "https://github.com/walruto/manim-hardware/issues"

[project.entry-points."manim.plugins"]
manim_hardware = "manim_hardware"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
