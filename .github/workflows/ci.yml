name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            manim: "0.22.0"
          - python: "3.13"
            manim: "0.19.2"
          - python: "3.13"
            manim: "0.20.0"
          - python: "3.13"
            manim: "0.21.0"
          - python: "3.13"
            manim: "0.22.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev pkg-config ffmpeg
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' "manim==${{ matrix.manim }}"
      - name: Test
        run: python -m pytest -q
      - name: Render integration scene
        if: matrix.python == '3.13' && matrix.manim == '0.22.0'
        run: python -m manim -ql examples/hardware_pipeline.py HardwarePipelineTest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
